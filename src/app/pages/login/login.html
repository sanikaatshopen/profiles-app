<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <!-- Heading -->
                    <div class="text-center mb-4">

                        <h2 class="fw-bold text-primary">
                            Login
                        </h2>

                        <p class="text-muted">
                            Welcome back 👋
                        </p>

                    </div>

                    <!-- Email -->
                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email" class="form-control rounded-3" (input)="email = $event.target.value"
                            placeholder="Enter email">

                    </div>

                    <!-- Password -->
                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password" class="form-control rounded-3" (input)="password = $event.target.value"
                            placeholder="Enter password">

                    </div>

                    <!-- Button -->
                    <div class="d-grid">

                        <button class="btn btn-primary rounded-3 py-2" (click)="login()">
                            Login
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
